version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: stock_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: stock_admin
      POSTGRES_PASSWORD: stock_secret_2024
      POSTGRES_DB: stock_monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_admin -d stock_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
